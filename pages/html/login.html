<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Let's Talk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <main class="auth">
    <form class="formulario" action="panel.html">
      <h1 class="titulo">Iniciar sesión</h1>

      <label class="sr-only" for="correo">Correo institucional</label>
      <input class="campo" id="correo" type="email" placeholder="Correo institucional"
             required pattern="estudiante@correo\.tdea\.edu\.co"
             title="Usuario de prueba: estudiante@correo.tdea.edu.co">

      <label class="sr-only" for="clave">Contraseña</label>
      <input class="campo" id="clave" type="password" placeholder="Contraseña"
             required pattern="12345678"
             title="Contraseña de prueba: 12345678">

      <button class="boton" type="submit">Entrar</button>

      <a class="enlace-olvido" href="#">¿Olvidaste tu contraseña?</a>
      <p class="alterno">¿No tienes cuenta? <a href="crear_usuario.html">Crear cuenta</a></p>
      <p class="demo">Modo demostración: estudiante@correo.tdea.edu.co / 12345678</p>
    </form>
  </main>

</body>
</html>
